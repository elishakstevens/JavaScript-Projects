<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Double Click</title>
        <meta charset="utf-8">
    </head>
    <body>
        <p id="doubleClick" ondblclick="doubleClick()" style="cursor: pointer;">Double Click!</p>

        <script>
            function doubleClick() {
                document.getElementById('doubleClick').innerHTML = "You double-clicked!";
            }
        </script>

    </body>
</html>
